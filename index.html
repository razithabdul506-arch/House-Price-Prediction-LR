<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Price Prediction</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6fa;
    color: #222;
    max-width: 560px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 24px; }
  form {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .full { grid-column: 1 / -1; }
  button {
    grid-column: 1 / -1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93b4f0; cursor: default; }
  #result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    display: none;
  }
  #result.ok { background: #ecfdf5; border: 1px solid #a7f3d0; display: block; }
  #result.err { background: #fef2f2; border: 1px solid #fecaca; display: block; }
  #result .price { font-size: 1.6rem; font-weight: 700; color: #047857; }
</style>
</head>
<body>

<h1>House Price Prediction</h1>
<p class="sub">Linear Regression model trained on the Housing.csv dataset.</p>

<form id="predict-form">
  <div>
    <label>Area (sqft)</label>
    <input type="number" name="area" value="7420" required>
  </div>
  <div>
    <label>Bedrooms</label>
    <input type="number" name="bedrooms" value="4" required>
  </div>
  <div>
    <label>Bathrooms</label>
    <input type="number" name="bathrooms" value="2" required>
  </div>
  <div>
    <label>Stories</label>
    <input type="number" name="stories" value="3" required>
  </div>
  <div>
    <label>Parking spots</label>
    <input type="number" name="parking" value="2" required>
  </div>
  <div>
    <label>Furnishing status</label>
    <select name="furnishingstatus">
      <option value="furnished">Furnished</option>
      <option value="semi-furnished">Semi-furnished</option>
      <option value="unfurnished">Unfurnished</option>
    </select>
  </div>

  <div><label>Main road</label>
    <select name="mainroad"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>
  <div><label>Guest room</label>
    <select name="guestroom"><option value="no">No</option><option value="yes">Yes</option></select>
  </div>
  <div><label>Basement</label>
    <select name="basement"><option value="no">No</option><option value="yes">Yes</option></select>
  </div>
  <div><label>Hot water heating</label>
    <select name="hotwaterheating"><option value="no">No</option><option value="yes">Yes</option></select>
  </div>
  <div><label>Air conditioning</label>
    <select name="airconditioning"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>
  <div><label>Preferred area</label>
    <select name="prefarea"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>

  <button type="submit" class="full">Predict Price</button>
</form>

<div id="result"></div>

<script>
// === MODEL_START === generated by train_model.py, do not edit by hand
const MODEL = {
  "intercept": 260032.35760741122,
  "coef": {
    "area": 235.96880454139554,
    "bedrooms": 76778.70163437934,
    "bathrooms": 1094444.7861005955,
    "stories": 407476.5949849113,
    "parking": 224841.91327662778,
    "mainroad_yes": 367919.9476795723,
    "guestroom_yes": 231610.0371756495,
    "basement_yes": 390251.17618109274,
    "hotwaterheating_yes": 684649.8853387905,
    "airconditioning_yes": 791426.735843187,
    "prefarea_yes": 629890.5653133605,
    "furnishingstatus_semi-furnished": -126881.81758510887,
    "furnishingstatus_unfurnished": -413645.06222822156
  },
  "columns": [
    "area",
    "bedrooms",
    "bathrooms",
    "stories",
    "parking",
    "mainroad_yes",
    "guestroom_yes",
    "basement_yes",
    "hotwaterheating_yes",
    "airconditioning_yes",
    "prefarea_yes",
    "furnishingstatus_semi-furnished",
    "furnishingstatus_unfurnished"
  ]
};
// === MODEL_END ===
</script>
<script>
const form = document.getElementById('predict-form');
const resultBox = document.getElementById('result');

const NUMERIC = ['area', 'bedrooms', 'bathrooms', 'stories', 'parking'];
const YES_NO = ['mainroad', 'guestroom', 'basement', 'hotwaterheating',
                'airconditioning', 'prefarea'];

// Rebuild the one-hot row train_model.py produced with pd.get_dummies(...,
// drop_first=True): each yes/no field becomes <field>_yes, and furnishing
// becomes two columns with "furnished" as the dropped baseline (both 0).
function buildRow(data) {
  const row = {};
  MODEL.columns.forEach(c => { row[c] = 0; });

  NUMERIC.forEach(f => { row[f] = Number(data[f]); });
  YES_NO.forEach(f => {
    const col = f + '_yes';
    if (col in row) row[col] = data[f] === 'yes' ? 1 : 0;
  });

  const furnishing = data.furnishingstatus;
  if (furnishing === 'semi-furnished') row['furnishingstatus_semi-furnished'] = 1;
  else if (furnishing === 'unfurnished') row['furnishingstatus_unfurnished'] = 1;

  return row;
}

// A linear regression is a dot product, so this matches sklearn exactly.
function predict(data) {
  const row = buildRow(data);
  return MODEL.columns.reduce(
    (sum, c) => sum + MODEL.coef[c] * row[c],
    MODEL.intercept
  );
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  try {
  const data = Object.fromEntries(new FormData(form).entries());

  const missing = NUMERIC.filter(f => !Number.isFinite(Number(data[f])));
  if (missing.length) {
    resultBox.className = 'err';
    resultBox.textContent = 'Please enter a number for: ' + missing.join(', ');
    return;
  }

  const price = predict(data);
  if (!Number.isFinite(price)) throw new Error('Model returned an invalid number');

  resultBox.className = 'ok';
  resultBox.innerHTML = 'Predicted Price<br><span class="price">\u20b9' +
    price.toLocaleString('en-IN', { maximumFractionDigits: 2 }) + '</span>';
  } catch (err) {
    // Without this the button would just do nothing and give you no clue why.
    resultBox.className = 'err';
    resultBox.textContent = 'Could not predict: ' + err.message;
  }
});
</script>

</body>
</html>
